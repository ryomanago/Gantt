<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Planner Prototype</title>
  <style>
    :root {
      --bg: #f4f8ff;
      --surface: #ffffff;
      --surface-soft: #eaf2fb;
      --surface-muted: #d8e8f7;
      --line: #c1d7ee;
      --line-strong: #6fa2d4;
      --text: #000000;
      --muted: #334e7d;
      --primary: #2166ad;
      --primary-dark: #174b83;
      --accent: #197a4b;
      --warning: #fb5b01;
      --danger: #ce0000;
      --purple: #3460fb;
      --row-h: 44px;
      --day-w: 36px;
      --left-w: 460px;
      --radius: 4px;
      --shadow: none;
      --focus: 0 0 0 3px rgba(33, 102, 173, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Meiryo", "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 13px;
      letter-spacing: 0;
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr;
      overflow: hidden;
    }

    body.gantt-fullscreen .app {
      grid-template-rows: auto 1fr;
    }

    body.gantt-fullscreen .filters,
    body.gantt-fullscreen .summary {
      display: none;
    }

    body.gantt-fullscreen .workspace {
      grid-template-columns: 1fr;
    }

    body.gantt-fullscreen .tabs {
      display: none;
    }

    body.gantt-fullscreen .view {
      margin: 12px;
      border-radius: 4px;
    }

    body.gantt-fullscreen .gantt {
      grid-template-columns: minmax(360px, 420px) minmax(640px, 1fr);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 22px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 220px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .brand span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      color: var(--text);
      background: var(--surface);
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn.primary {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    .btn.primary:hover {
      background: var(--primary-dark);
      color: #fff;
    }

    .btn.icon {
      width: 34px;
      padding: 0;
      font-size: 17px;
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(160px, 220px);
      gap: 10px;
      padding: 12px 22px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .field {
      min-width: 0;
    }

    .field label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #fff;
      color: var(--text);
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 280px 1fr;
    }

    .summary {
      min-height: 0;
      padding: 18px;
      background: #eef3fa;
      border-right: 1px solid var(--line);
      overflow: auto;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .metric {
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .metric strong {
      display: block;
      font-size: 22px;
      line-height: 1;
    }

    .metric span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .section-title {
      margin: 18px 0 8px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 800;
    }

    .health {
      display: grid;
      gap: 8px;
    }

    .health-row {
      display: grid;
      grid-template-columns: 86px 1fr 34px;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .bar-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5eaf1;
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
    }

    .main {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 18px 0;
      background: var(--bg);
    }

    .tab {
      min-width: 86px;
      height: 36px;
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: 8px 8px 0 0;
      background: #e9eef5;
      color: var(--muted);
      cursor: pointer;
      font-weight: 700;
    }

    .tab.active {
      background: var(--surface);
      color: var(--primary);
    }

    .view {
      min-width: 0;
      min-height: 0;
      margin: 0 18px 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .gantt {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(360px, var(--left-w)) minmax(520px, 1fr);
      min-width: 0;
      min-height: 0;
      position: relative;
    }

    .gantt-fullscreen-toggle {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 12;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid #c1d7ee;
      border-radius: 50%;
      background: #fff;
      color: var(--primary);
      box-shadow: 0 6px 18px rgba(33, 102, 173, 0.18);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }

    .gantt-fullscreen-toggle:hover {
      background: #eaf2fb;
    }

    .task-table,
    .timeline {
      min-height: 0;
      overflow: auto;
    }

    .task-table {
      border-right: 1px solid var(--line);
      overflow: auto;
      scrollbar-gutter: stable;
      position: relative;
    }

    .task-table.is-y-synced {
      overflow-x: auto;
      overflow-y: hidden;
    }

    #taskRows {
      will-change: transform;
    }

    .task-add-panel {
      position: sticky;
      left: 0;
      bottom: 0;
      z-index: 9;
      display: flex;
      gap: 8px;
      min-width: 360px;
      padding: 10px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
    }

    .task-add-panel .btn {
      flex: 1;
    }

    .table-head,
    .task-row {
      display: grid;
      grid-template-columns: 1.7fr 90px 86px 86px 72px 46px;
      align-items: center;
      min-width: 700px;
    }

    .table-head {
      position: sticky;
      top: 0;
      z-index: 4;
      height: 58px;
      padding: 0 10px;
      background: var(--surface-soft);
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .head-filter {
      display: grid;
      gap: 4px;
      align-content: center;
      min-width: 0;
    }

    .head-filter select {
      width: 100%;
      height: 24px;
      min-width: 0;
      padding: 0 6px;
      border: 1px solid #c1d7ee;
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
    }

    .task-row {
      height: var(--row-h);
      padding: 0 10px;
      border-bottom: 1px solid #edf1f6;
      cursor: pointer;
    }

    .task-row:hover,
    .task-row.selected {
      background: #eff6ff;
    }

    .task-row.dragging {
      opacity: 0.48;
    }

    .task-row.drop-before {
      box-shadow: inset 0 3px 0 var(--primary);
    }

    .task-row.drop-after {
      box-shadow: inset 0 -3px 0 var(--primary);
    }

    .name-cell {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tree-toggle {
      width: 20px;
      height: 24px;
      display: inline-grid;
      place-items: center;
      border-radius: 5px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .tree-toggle:hover {
      background: #e7eef8;
      color: var(--primary);
    }

    .type-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 10px;
      border-radius: 50%;
      background: var(--primary);
    }

    .type-dot.milestone {
      width: 14px;
      height: 14px;
      border-radius: 0;
      background: transparent;
      color: var(--danger);
      transform: none;
      display: inline-grid;
      place-items: center;
      font-size: 14px;
      line-height: 1;
    }

    .type-dot.milestone::before {
      content: "★";
    }

    .type-dot.group {
      width: 12px;
      height: 8px;
      border-radius: 2px;
      background: var(--purple);
    }

    .cell-input {
      width: 100%;
      min-width: 0;
      height: 28px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      padding: 0 6px;
    }

    .cell-input:hover,
    .cell-input:focus {
      border-color: var(--line-strong);
      background: #fff;
    }

    .mini-select {
      width: calc(100% - 4px);
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 0 6px;
      font-size: 12px;
    }

    .date-text {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .timeline-head {
      position: sticky;
      top: 0;
      z-index: 5;
      width: max-content;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .timeline-toolbar {
      position: sticky;
      top: 0;
      right: 0;
      z-index: 9;
      float: right;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      margin: 6px 8px -38px 0;
      padding: 3px;
      border: 1px solid #c1d7ee;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
    }

    .timeline-toolbar button,
    .timeline-toolbar select {
      height: 24px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
    }

    .timeline-toolbar button {
      width: 28px;
      font-size: 16px;
      line-height: 1;
    }

    .timeline-toolbar button:hover,
    .timeline-toolbar select:hover {
      background: #eaf2fb;
    }

    .timeline-toolbar .range-label {
      min-width: 72px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }

    .month-row,
    .day-row {
      display: flex;
      height: 29px;
    }

    .month-cell,
    .day-cell {
      flex: 0 0 var(--day-w);
      width: var(--day-w);
      border-right: 1px solid #edf1f6;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .month-cell {
      justify-content: start;
      padding-left: 10px;
      background: var(--surface-soft);
      border-bottom: 1px solid #edf1f6;
    }

    .day-cell.today,
    .grid-col.today {
      background: #fff7ed;
      color: #c2410c;
    }

    .timeline-body {
      position: relative;
      width: max-content;
      min-height: 100%;
    }

    .timeline-row {
      position: relative;
      height: var(--row-h);
      border-bottom: 1px solid #edf1f6;
    }

    .timeline-row.drop-before {
      box-shadow: inset 0 3px 0 var(--primary);
    }

    .timeline-row.drop-after {
      box-shadow: inset 0 -3px 0 var(--primary);
    }

    .grid-col {
      position: absolute;
      top: 0;
      bottom: 0;
      width: var(--day-w);
      border-right: 1px solid #edf1f6;
      pointer-events: none;
    }

    .task-bar {
      position: absolute;
      top: 13px;
      z-index: 4;
      height: 18px;
      min-width: 10px;
      border-radius: 5px;
      background: #cbd5e1;
      cursor: grab;
      overflow: visible;
    }

    .task-bar:active {
      cursor: grabbing;
    }

    .task-bar.group {
      top: 19px;
      height: 5px;
      background: var(--purple);
      border-radius: 999px;
    }

    .task-bar.milestone {
      width: 18px;
      min-width: 18px;
      height: 18px;
      top: 12px;
      border-radius: 0;
      background: transparent;
      color: var(--danger);
      transform: none;
      display: grid;
      place-items: center;
      font-size: 18px;
      line-height: 1;
      box-shadow: none;
    }

    .task-bar.milestone::before {
      content: "★";
    }

    .progress {
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
      pointer-events: none;
    }

    .task-bar.done .progress {
      background: var(--accent);
    }

    .task-bar.blocked .progress {
      background: var(--danger);
    }

    .bar-label {
      position: absolute;
      left: calc(100% + 8px);
      top: 50%;
      transform: translateY(-50%);
      max-width: 210px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
      pointer-events: none;
    }

    .task-bar.milestone .bar-label {
      transform: translateY(-50%);
    }

    .resize {
      position: absolute;
      top: 0;
      width: 8px;
      height: 100%;
      cursor: ew-resize;
    }

    .resize.left {
      left: -2px;
    }

    .resize.right {
      right: -2px;
    }

    .dependency-handle {
      position: absolute;
      right: -9px;
      top: 50%;
      z-index: 8;
      width: 10px;
      height: 10px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: var(--primary);
      transform: translateY(-50%);
      cursor: crosshair;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease;
    }

    .task-bar:hover .dependency-handle,
    .dependency-handle:hover,
    body.linking-dependency .dependency-handle {
      opacity: 1;
      pointer-events: auto;
    }

    .dependency-handle.left {
      left: -9px;
      right: auto;
    }

    .task-bar.milestone .dependency-handle {
      right: -12px;
    }

    .task-bar.milestone .dependency-handle.left {
      left: -12px;
    }

    .dependency-preview {
      fill: none;
      stroke: var(--primary);
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
      pointer-events: none;
    }

    .timeline-row.dependency-target {
      background: rgba(33, 102, 173, 0.08);
    }

    .dependency-layer {
      position: absolute;
      inset: 0 auto auto 0;
      z-index: 2;
      overflow: visible;
      pointer-events: auto;
    }

    .dependency-line {
      fill: none;
      stroke: #6fa2d4;
      stroke-width: 1.25;
      opacity: 0.58;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .dependency-line-shadow {
      fill: none;
      stroke: #ffffff;
      stroke-width: 4;
      opacity: 0.86;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .dependency-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 12;
      cursor: pointer;
      pointer-events: stroke;
    }

    .dependency-line.is-warning {
      stroke: #fb5b01;
      stroke-dasharray: 4 4;
      opacity: 0.5;
    }

    .dependency-label {
      max-width: 90px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }

    .board {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(190px, 1fr));
      gap: 12px;
      padding: 14px;
      overflow: auto;
      background: #f8fafc;
    }

    .lane {
      min-width: 190px;
      display: grid;
      grid-template-rows: auto 1fr;
      background: #eef3fa;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .lane h2 {
      margin: 0;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .lane-body {
      padding: 10px;
      display: grid;
      align-content: start;
      gap: 10px;
      overflow: auto;
    }

    .task-card {
      padding: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      cursor: pointer;
    }

    .task-card:hover {
      border-color: var(--primary);
    }

    .task-card strong {
      display: block;
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      font-weight: 700;
      font-size: 11px;
    }

    .pill.high {
      background: #fee2e2;
      color: #b91c1c;
    }

    .pill.medium {
      background: #fef3c7;
      color: #92400e;
    }

    .pill.low {
      background: #dcfce7;
      color: #166534;
    }

    .list-view {
      height: 100%;
      overflow: auto;
    }

    .list-table {
      width: 100%;
      min-width: 920px;
      border-collapse: collapse;
    }

    .list-table th,
    .list-table td {
      height: 44px;
      padding: 8px 10px;
      border-bottom: 1px solid #edf1f6;
      text-align: left;
      vertical-align: middle;
    }

    .list-table th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 11px;
    }

    .drawer {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      background: rgba(15, 23, 42, 0.28);
    }

    .drawer.open {
      display: grid;
      justify-content: end;
    }

    .drawer-panel {
      width: min(440px, 100vw);
      height: 100vh;
      padding: 18px;
      background: var(--surface);
      box-shadow: -18px 0 42px rgba(15, 23, 42, 0.16);
      overflow: auto;
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .drawer-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-grid .wide {
      grid-column: 1 / -1;
    }

    .form-grid select[multiple] {
      min-height: 116px;
      padding: 6px 8px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      padding: 10px;
      resize: vertical;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      font: inherit;
    }

    .drawer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 16px;
    }

    .empty {
      padding: 42px 16px;
      color: var(--muted);
      text-align: center;
    }

    .topbar {
      padding: 18px 24px 16px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
    }

    .brand-mark {
      background: linear-gradient(135deg, var(--primary), #2d7be8);
      box-shadow: 0 8px 18px rgba(34, 81, 199, 0.24);
    }

    .brand h1 {
      font-weight: 800;
    }

    .btn {

<body>

  <script>
    const STORAGE_KEY = "project-planner-prototype-v1";
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const statusMeta = {
      todo: { label: "未着手", color: "#64748b" },
      doing: { label: "進行中", color: "#2563eb" },
      review: { label: "レビュー", color: "#7c3aed" },
      done: { label: "完了", color: "#10b981" },
      blocked: { label: "保留", color: "#ef4444" }
    };

    const priorityMeta = {
      high: "高",
      medium: "中",
      low: "低"
    };

    const seedTasks = [
      {
        id: "p1",
        name: "新規サービス立ち上げ",
        owner: "PM",
        status: "doing",
        priority: "high",
        start: "2026-05-10",

        progress: 46,

        parent: "",
        type: "group",

      },
      {

        status: "done",
        priority: "high",
        start: "2026-05-10",
        end: "2026-05-14",
        progress: 100,
        dependencies: [],
        parent: "p1",
        type: "task",
        expanded: true,
        notes: "関係者レビュー済み。"
      },
      {
        id: "m1",
        name: "要件確定",
        owner: "PM",
        status: "done",
        priority: "high",
        start: "2026-05-15",
        end: "2026-05-15",
        progress: 100,
        dependencies: ["t1"],
        parent: "p1",
        type: "milestone",
        expanded: true,
        notes: "仕様の凍結ポイント。"
      },
      {
        id: "t2",
        name: "UIプロトタイプ作成",
        owner: "田中",
        status: "doing",
        priority: "medium",
        start: "2026-05-16",
        end: "2026-05-24",
        progress: 55,
        dependencies: ["m1"],
        parent: "p1",
        type: "task",
        expanded: true,
        notes: "主要3画面の操作感を確認する。"
      },
      {
        id: "t3",
        name: "API設計",
        owner: "鈴木",
        status: "review",
        priority: "medium",
        start: "2026-05-18",
        end: "2026-05-27",
        progress: 70,
        dependencies: ["t1"],
        parent: "p1",
        type: "task",
        expanded: true,
        notes: "認証と通知周りを重点確認。"
      },
      {
        id: "t4",
        name: "β版リリース準備",
        owner: "山田",
        status: "todo",
        priority: "high",
        start: "2026-05-28",
        end: "2026-06-03",
        progress: 0,
        dependencies: ["t2", "t3"],
        parent: "p1",
        type: "task",
        expanded: true,
        notes: "リリースノート、検証観点、戻し手順をまとめる。"
      }
    ];

    let tasks = loadTasks();
    let activeView = "gantt";
    let selectedTaskId = "";
    let editingTaskId = "";
    let ganttFullscreen = false;
    const tableFilters = { owner: "", status: "", type: "", priority: "" };
    let viewStartDate = "";

    const els = {
      viewRoot: document.getElementById("viewRoot"),
      scaleSelect: document.getElementById("scaleSelect"),
      drawer: document.getElementById("drawer"),
      taskForm: document.getElementById("taskForm")
    };

    function loadTasks() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(stored) && stored.length) {
          const seedById = new Map(seedTasks.map(task => [task.id, task]));
          return stored.map(task => {
            const seed = seedById.get(task.id);
            return {
              ...task,
              dependencies: Array.isArray(task.dependencies) ? task.dependencies : structuredClone(seed?.dependencies || [])
            };
          });
        }
        return structuredClone(seedTasks);
      } catch {
        return structuredClone(seedTasks);
      }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function parseDate(value) {
      const parts = String(value || "").split("-").map(Number);
      const date = new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1);
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function formatDate(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function addDays(date, days) {
      const next = new Date(date);
      next.setDate(next.getDate() + days);
      return next;
    }

    function daysBetween(a, b) {
      return Math.round((parseDate(b) - parseDate(a)) / 86400000);
    }

    function clamp(num, min, max) {
      return Math.min(max, Math.max(min, Number(num) || 0));
    }

    function normalizeTask(task) {
      if (!Array.isArray(task.dependencies)) task.dependencies = task.dependency ? [task.dependency] : [];
      task.dependencies = task.dependencies.filter(id => id && id !== task.id && tasks.some(item => item.id === id));
      if (task.type === "milestone") task.end = task.start;
      if (parseDate(task.end) < parseDate(task.start)) task.end = task.start;
      task.progress = clamp(task.progress, 0, 100);
      if (task.status !== "blocked") {
        if (task.progress >= 100) task.status = "done";
        else if (task.progress >= 1) task.status = "doing";
        else task.status = "todo";
      }
    }

    function childrenOf(parentId) {
      return tasks.filter(task => task.parent === parentId);
    }

    function descendantsOf(parentId) {
      return childrenOf(parentId).flatMap(child => [child, ...descendantsOf(child.id)]);
    }

    function visibleTasks() {
      const { status, owner, type, priority } = tableFilters;
      const matchedIds = new Set();

      tasks.forEach(task => {
        const matchesStatus = !status || task.status === status;
        const matchesOwner = !owner || task.owner === owner;
        const matchesType = !type || task.type === type;
        const matchesPriority = !priority || task.priority === priority;
        if (matchesStatus && matchesOwner && matchesType && matchesPriority) {
          matchedIds.add(task.id);
          let parent = tasks.find(item => item.id === task.parent);
          while (parent) {
            matchedIds.add(parent.id);
            parent = tasks.find(item => item.id === parent.parent);
          }
        }
      });

      const rows = [];
      function walk(parentId, level) {
        childrenOf(parentId).forEach(task => {
          if (matchedIds.has(task.id)) rows.push({ task, level });
          if (task.expanded !== false || status || owner || type || priority) walk(task.id, level + 1);
        });
      }
      walk("", 0);
      return rows;
    }

    function taskStats(baseTasks = tasks.filter(task => task.type !== "group")) {
      const total = baseTasks.length;
      const done = baseTasks.filter(task => task.status === "done").length;
      const late = baseTasks.filter(task => task.status !== "done" && parseDate(task.end) < today).length;
      const avg = total ? Math.round(baseTasks.reduce((sum, task) => sum + Number(task.progress || 0), 0) / total) : 0;
      return { total, done, late, avg };
    }

    function syncParentDates(parentId) {
      if (!parentId) return;
      const parent = tasks.find(task => task.id === parentId);
      const kids = childrenOf(parentId);
      if (parent && kids.length) {
        parent.start = kids.map(task => task.start).sort()[0];
        parent.end = kids.map(task => task.end).sort().at(-1);
        const trackable = kids.filter(task => task.type !== "milestone");
        parent.progress = trackable.length
          ? Math.round(trackable.reduce((sum, task) => sum + Number(task.progress || 0), 0) / trackable.length)
          : Math.round(kids.reduce((sum, task) => sum + Number(task.progress || 0), 0) / kids.length);
        parent.status = parent.progress >= 100 ? "done" : parent.progress > 0 ? "doing" : "todo";
        syncParentDates(parent.parent);
      }
    }

    function updateSelectOptions() {
      const owners = [...new Set(tasks.map(task => task.owner).filter(Boolean))].sort();
      if (!owners.includes(tableFilters.owner)) tableFilters.owner = "";

      document.getElementById("ownerOptions").innerHTML = owners
        .map(owner => `<option value="${escapeHtml(owner)}"></option>`).join("");

      document.getElementById("formStatus").innerHTML = Object.entries(statusMeta)
        .map(([value, meta]) => `<option value="${value}">${meta.label}</option>`).join("");
      document.getElementById("formPriority").innerHTML = Object.entries(priorityMeta)
        .map(([value, label]) => `<option value="${value}">${label}</option>`).join("");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function render() {
      tasks.forEach(normalizeTask);
      saveTasks();
      updateSelectOptions();
      renderSummary();
      document.body.classList.toggle("gantt-fullscreen", ganttFullscreen);

      document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.toggle("active", tab.dataset.view === activeView);
      });

      if (activeView === "board") renderBoard();
      else if (activeView === "list") renderList();
      else renderGantt();
    }

    function renderSummary() {
      const stats = taskStats();
      document.getElementById("totalCount").textContent = stats.total;
      document.getElementById("doneCount").textContent = stats.done;
      document.getElementById("lateCount").textContent = stats.late;
      document.getElementById("avgProgress").textContent = `${stats.avg}%`;

      const starts = tasks.map(task => task.start).sort();
      const ends = tasks.map(task => task.end).sort();
      document.getElementById("projectRange").textContent = `${compactDate(starts[0])} - ${compactDate(ends.at(-1))}`;

      const total = Math.max(1, tasks.filter(task => task.type !== "group").length);
      document.getElementById("statusHealth").innerHTML = Object.entries(statusMeta).map(([status, meta]) => {
        const count = tasks.filter(task => task.type !== "group" && task.status === status).length;
        const pct = Math.round(count / total * 100);
        return `<div class="health-row">
          <span>${meta.label}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${meta.color}"></div></div>
          <strong>${count}</strong>
        </div>`;
      }).join("");

      const upcoming = tasks
        .filter(task => task.type !== "group" && task.status !== "done")
        .sort((a, b) => parseDate(a.end) - parseDate(b.end))
        .slice(0, 4);
      document.getElementById("upcomingList").innerHTML = upcoming.length ? upcoming.map(task => `
        <div class="health-row">
          <span>${compactDate(task.end)}</span>
          <div title="${escapeHtml(task.name)}">${escapeHtml(task.name)}</div>
          <strong>${task.progress}%</strong>
        </div>
      `).join("") : `<div class="empty">譛ｪ螳御ｺ・ち繧ｹ繧ｯ縺ｯ縺ゅｊ縺ｾ縺帙ｓ</div>`;
    }

    function compactDate(value) {
      if (!value) return "-";
      const date = parseDate(value);
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function renderGantt() {
      const rows = visibleTasks();
      const scale = els.scaleSelect.value;
      const unitDays = scale === "week" ? 7 : 1;
      const dayW = scale === "week" ? 58 : 36;
      document.documentElement.style.setProperty("--day-w", `${dayW}px`);
      const rangeStart = parseDate(viewStartDate || earliestStart());
      const columnCount = scale === "week" ? 18 : 54;
      const timelineWidth = columnCount * dayW;

      els.viewRoot.innerHTML = `
        <div class="gantt">
          <div class="task-table">
            <div class="table-head">
              <div class="head-filter"><span>タスク名</span><select data-table-filter="type">${typeFilterOptions()}</select></div>
              <div class="head-filter"><span>担当者</span><select data-table-filter="owner">${ownerFilterOptions()}</select></div>
              <div class="head-filter"><span>状態</span><select data-table-filter="status">${statusFilterOptions()}</select></div>
              <div>進捗</div>
              <div class="head-filter"><span>優先度</span><select data-table-filter="priority">${priorityFilterOptions()}</select></div>
              <div></div>
            </div>
            <div id="taskRows"></div>
            <div class="task-add-panel">
              <button class="btn primary" id="addTaskBtn">＋ タスク</button>
              <button class="btn" id="addMilestoneBtn">★ マイルストーン</button>
            </div>
          </div>
          <div class="timeline">
            <div class="timeline-toolbar" id="timelineToolbar" title="ホイールで表示期間を移動">
              <button type="button" data-shift-range="-1" aria-label="前へ">‹</button>
              <span class="range-label">${compactDate(formatDate(rangeStart))}</span>
              <button type="button" data-shift-range="1" aria-label="次へ">›</button>
              <select id="timelineScaleSelect" aria-label="表示単位">
                <option value="day" ${scale === "day" ? "selected" : ""}>日</option>
                <option value="week" ${scale === "week" ? "selected" : ""}>週</option>
              </select>
            </div>
            <div class="timeline-head" id="timelineHead"></div>
            <div class="timeline-body" id="timelineBody" style="width:${timelineWidth}px"></div>
          </div>
          <button class="gantt-fullscreen-toggle" id="ganttFullscreenToggle" title="${ganttFullscreen ? "通常表示" : "全画面表示"}" aria-label="${ganttFullscreen ? "通常表示" : "全画面表示"}">${ganttFullscreen ? "↙" : "⛶"}</button>
        </div>
      `;

      document.getElementById("taskRows").innerHTML = rows.map(({ task, level }) => taskRowHtml(task, level)).join("")
        || `<div class="empty">譚｡莉ｶ縺ｫ蜷医≧繧ｿ繧ｹ繧ｯ縺後≠繧翫∪縺帙ｓ</div>`;

      const { monthRow, dayRow } = timelineHeader(rangeStart, columnCount, unitDays, dayW);
      document.getElementById("timelineHead").innerHTML = monthRow + dayRow;

      const timelineBody = document.getElementById("timelineBody");
      timelineBody.style.height = `${Math.max(rows.length, 1) * 44}px`;
      timelineBody.innerHTML = dependencySvg(rows, rangeStart, unitDays, dayW, columnCount)
        + rows.map(({ task }, index) => timelineRowHtml(task, index, rangeStart, unitDays, dayW, columnCount)).join("");
      bindGanttEvents(rangeStart, unitDays);
      bindGanttScrollSync();
    }

    function taskRowHtml(task, level) {
      const canExpand = childrenOf(task.id).length > 0;
      const indent = level * 18;
      return `<div class="task-row ${selectedTaskId === task.id ? "selected" : ""}" data-open="${task.id}" data-reorder="${task.id}" draggable="true">
        <div class="name-cell" style="padding-left:${indent}px">
          <button class="tree-toggle" data-toggle="${task.id}" title="開閉">${canExpand ? (task.expanded === false ? "›" : "⌄") : ""}</button>
          <span class="type-dot ${task.type}"></span>
          <input class="cell-input" value="${escapeHtml(task.name)}" data-field="name" data-id="${task.id}" aria-label="タスク名">
        </div>
        <div><input class="cell-input" value="${escapeHtml(task.owner || "")}" data-field="owner" data-id="${task.id}" aria-label="担当者"></div>
        <div><select class="mini-select" data-field="status" data-id="${task.id}">${statusOptions(task.status)}</select></div>
        <div><input class="cell-input" type="number" min="0" max="100" value="${task.progress}" data-field="progress" data-id="${task.id}" aria-label="進捗"></div>
        <div class="dependency-label" title="${escapeHtml(dependencyNames(task))}">${escapeHtml(dependencyNames(task) || "-")}</div>
        <div><button class="btn icon" data-child="${task.id}" title="子タスク追加">＋</button></div>
      </div>`;
    }

    function dependencyNames(task) {
      return (task.dependencies || [])
        .map(id => tasks.find(item => item.id === id)?.name)
        .filter(Boolean)
        .join(", ");
    }

    function removeDependency(fromId, toId) {
      const target = tasks.find(task => task.id === toId);
      if (!target) return false;
      const before = (target.dependencies || []).length;
      target.dependencies = (target.dependencies || []).filter(id => id !== fromId);
      if (target.dependencies.length === before) return false;
      saveTasks();
      return true;
    }

    function moveTaskBeforeOrAfter(sourceId, targetId, place) {
      if (!sourceId || !targetId || sourceId === targetId) return false;
      const source = tasks.find(task => task.id === sourceId);
      const target = tasks.find(task => task.id === targetId);
      if (!source || !target || source.parent !== target.parent) return false;

      const next = tasks.filter(task => task.id !== sourceId);
      const targetIndex = next.findIndex(task => task.id === targetId);
      if (targetIndex < 0) return false;
      next.splice(place === "after" ? targetIndex + 1 : targetIndex, 0, source);
      tasks = next;
      saveTasks();
      return true;
    }

    function statusOptions(current) {
      return Object.entries(statusMeta)
        .map(([value, meta]) => `<option value="${value}" ${current === value ? "selected" : ""}>${meta.label}</option>`)
        .join("");
    }

    function statusFilterOptions() {
      return `<option value="">すべて</option>` + Object.entries(statusMeta)
        .map(([value, meta]) => `<option value="${value}" ${tableFilters.status === value ? "selected" : ""}>${meta.label}</option>`)
        .join("");
    }

    function ownerFilterOptions() {
      const owners = [...new Set(tasks.map(task => task.owner).filter(Boolean))].sort();
      return `<option value="">すべて</option>` + owners
        .map(owner => `<option value="${escapeHtml(owner)}" ${tableFilters.owner === owner ? "selected" : ""}>${escapeHtml(owner)}</option>`)
        .join("");
    }

    function typeFilterOptions() {
      const labels = { task: "タスク", milestone: "マイルストーン", group: "グループ" };
      return `<option value="">すべて</option>` + Object.entries(labels)
        .map(([value, label]) => `<option value="${value}" ${tableFilters.type === value ? "selected" : ""}>${label}</option>`)
        .join("");
    }

    function priorityFilterOptions() {
      return `<option value="">すべて</option>` + Object.entries(priorityMeta)
        .map(([value, label]) => `<option value="${value}" ${tableFilters.priority === value ? "selected" : ""}>${label}</option>`)
        .join("");
    }

    function timelineHeader(start, count, unitDays, dayW) {
      const monthCells = [];
      const dayCells = [];
      let currentMonth = "";
      let monthWidth = 0;

      for (let i = 0; i < count; i++) {
        const date = addDays(start, i * unitDays);
        const monthLabel = `${date.getFullYear()}年 ${date.getMonth() + 1}月`;
        if (monthLabel !== currentMonth) {
          if (currentMonth) monthCells.push(`<div class="month-cell" style="width:${monthWidth}px;flex-basis:${monthWidth}px">${currentMonth}</div>`);
          currentMonth = monthLabel;
          monthWidth = 0;
        }
        monthWidth += dayW;
        const isToday = formatDate(date) === formatDate(today);
        const label = unitDays === 7 ? `${date.getMonth() + 1}/${date.getDate()}` : date.getDate();
        dayCells.push(`<div class="day-cell ${isToday ? "today" : ""}">${label}</div>`);
      }

      if (currentMonth) monthCells.push(`<div class="month-cell" style="width:${monthWidth}px;flex-basis:${monthWidth}px">${currentMonth}</div>`);
      return {
        monthRow: `<div class="month-row">${monthCells.join("")}</div>`,
        dayRow: `<div class="day-row">${dayCells.join("")}</div>`
      };
    }

    function dependencySvg(rows, rangeStart, unitDays, dayW, count) {
      const rowMap = new Map(rows.map(({ task }, index) => [task.id, { task, index }]));
      const width = count * dayW;
      const height = Math.max(rows.length, 1) * 44;
      const paths = [];

      rows.forEach(({ task }, index) => {
        (task.dependencies || []).forEach(depId => {
          const dep = rowMap.get(depId);
          if (!dep || dep.task.type === "group" || task.type === "group") return;

          const depStartX = daysBetween(formatDate(rangeStart), dep.task.start) / unitDays * dayW;
          const depEndX = (daysBetween(formatDate(rangeStart), dep.task.end) + 1) / unitDays * dayW;
          const fromX = dep.task.type === "milestone" ? depStartX + 9 : depEndX;
          const toX = daysBetween(formatDate(rangeStart), task.start) / unitDays * dayW;
          const fromY = dep.index * 44 + (dep.task.type === "milestone" && toX <= fromX + 18 ? 28 : 22);
          const toY = index * 44 + 22;
          const lane = paths.length % 5;
          const laneX = (lane - 2) * 7;
          const laneY = lane * 5;
          const midX = Math.max(fromX + 14, Math.min(toX - 10, (fromX + toX) / 2)) + laneX;
          const isWarning = parseDate(dep.task.end) >= parseDate(task.start);
          const path = toX > fromX + 18
            ? `M ${fromX} ${fromY} H ${midX} V ${toY} H ${toX - 6}`
            : `M ${fromX} ${fromY} V ${fromY + 18 + laneY} H ${toX - 18 - laneX} V ${toY} H ${toX - 6}`;

          paths.push(`<path class="dependency-line-shadow" d="${path}"></path><path class="dependency-line ${isWarning ? "is-warning" : ""}" d="${path}" marker-end="url(#dep-arrow)"></path><path class="dependency-hit" d="${path}" data-remove-dependency-from="${depId}" data-remove-dependency-to="${task.id}"><title>${escapeHtml(dep.task.name)} 竊・${escapeHtml(task.name)} 繧貞炎髯､</title></path>`);
        });
      });

      return `<svg class="dependency-layer" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
        <defs>
          <marker id="dep-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#6fa2d4" opacity="0.62"></path>
          </marker>
        </defs>
        ${paths.join("")}
      </svg>`;
    }

    function timelineRowHtml(task, index, rangeStart, unitDays, dayW, count) {
      const startOffset = daysBetween(formatDate(rangeStart), task.start) / unitDays * dayW;
      const duration = Math.max(1, daysBetween(task.start, task.end) + 1);
      const width = Math.max(task.type === "milestone" ? 14 : 12, duration / unitDays * dayW);
      const statusClass = task.status === "done" ? "done" : task.status === "blocked" ? "blocked" : "";
      const grid = Array.from({ length: count }, (_, i) => {
        const date = addDays(rangeStart, i * unitDays);
        return `<div class="grid-col ${formatDate(date) === formatDate(today) ? "today" : ""}" style="left:${i * dayW}px"></div>`;
      }).join("");

      return `<div class="timeline-row" data-timeline-row="${task.id}" style="top:${index * 0}px">
        ${grid}
        <div class="task-bar ${task.type} ${statusClass}" data-drag="${task.id}" style="left:${startOffset}px;width:${width}px">
          ${task.type === "task" ? `<span class="resize left" data-resize="left" data-id="${task.id}"></span>` : ""}
          ${task.type !== "milestone" ? `<div class="progress" style="width:${task.progress}%"></div>` : ""}
          ${task.type === "task" ? `<span class="resize right" data-resize="right" data-id="${task.id}"></span>` : ""}
          ${task.type !== "group" ? `<span class="dependency-handle left" data-link-from="${task.id}" title="萓晏ｭ倬未菫ゅｒ菴懈・"></span><span class="dependency-handle" data-link-from="${task.id}" title="萓晏ｭ倬未菫ゅｒ菴懈・"></span>` : ""}
          <span class="bar-label">${escapeHtml(task.name)}</span>
        </div>
      </div>`;
    }

    function renderBoard() {
      const visible = visibleTasks().map(row => row.task).filter(task => task.type !== "group");
      els.viewRoot.innerHTML = `<div class="board">
        ${Object.entries(statusMeta).filter(([status]) => status !== "blocked").map(([status, meta]) => {
          const laneTasks = visible.filter(task => task.status === status);
          return `<section class="lane">
            <h2><span>${meta.label}</span><span class="pill">${laneTasks.length}</span></h2>
            <div class="lane-body">
              ${laneTasks.map(boardCardHtml).join("") || `<div class="empty">タスクなし</div>`}
            </div>
          </section>`;
        }).join("")}
      </div>`;
    }

    function boardCardHtml(task) {
      return `<article class="task-card" data-open="${task.id}">
        <strong>${escapeHtml(task.name)}</strong>
        <div class="card-meta">
          <span class="pill ${task.priority}">${priorityMeta[task.priority]}</span>
          <span>${escapeHtml(task.owner || "未設定")}</span>
          <span>${compactDate(task.start)} - ${compactDate(task.end)}</span>
          <span>${task.progress}%</span>
        </div>
      </article>`;
    }

    function renderList() {
      const rows = visibleTasks();
      els.viewRoot.innerHTML = `<div class="list-view">
        <table class="list-table">
          <thead>
            <tr>
              <th>タスク名</th><th>種別</th><th>担当者</th><th>状態</th><th>優先度</th><th>開始</th><th>終了</th><th>進捗</th><th>依存先</th><th>メモ</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(({ task, level }) => `<tr data-open="${task.id}">
              <td style="padding-left:${12 + level * 18}px">${escapeHtml(task.name)}</td>
              <td>${task.type === "group" ? "グループ" : task.type === "milestone" ? "マイルストーン" : "タスク"}</td>
              <td>${escapeHtml(task.owner || "")}</td>
              <td>${statusMeta[task.status].label}</td>
              <td><span class="pill ${task.priority}">${priorityMeta[task.priority]}</span></td>
              <td>${task.start}</td>
              <td>${task.end}</td>
              <td>${task.progress}%</td>
              <td>${escapeHtml(dependencyNames(task))}</td>
              <td>${escapeHtml(task.notes || "")}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>`;
    }

    function bindGanttEvents(rangeStart, unitDays) {
      let draggingTaskId = "";

      const shiftRange = amount => {
        viewStartDate = formatDate(addDays(parseDate(viewStartDate || earliestStart()), amount * unitDays));
        render();
      };

      document.querySelectorAll("[data-shift-range]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          shiftRange(Number(button.dataset.shiftRange));
        });
      });

      document.getElementById("timelineScaleSelect")?.addEventListener("change", event => {
        els.scaleSelect.value = event.target.value;
        render();
      });

      document.getElementById("timelineToolbar")?.addEventListener("wheel", event => {
        event.preventDefault();
        shiftRange(event.deltaY > 0 ? 1 : -1);
      }, { passive: false });

      document.querySelectorAll("[data-field]").forEach(input => {
        input.addEventListener("click", event => event.stopPropagation());
        input.addEventListener("change", event => {
          const task = tasks.find(item => item.id === event.target.dataset.id);
          if (!task) return;
          const field = event.target.dataset.field;
          task[field] = field === "progress" ? clamp(event.target.value, 0, 100) : event.target.value;
          if (field === "status") {
            if (task.status === "done") task.progress = 100;
            else if (task.status === "todo") task.progress = 0;
            else if (task.status === "doing" && (task.progress === 0 || task.progress === 100)) task.progress = 50;
          }
          normalizeTask(task);
          syncParentDates(task.parent);
          render();
        });
      });

      document.querySelectorAll("[data-table-filter]").forEach(select => {
        select.addEventListener("click", event => event.stopPropagation());
        select.addEventListener("change", event => {
          tableFilters[select.dataset.tableFilter] = event.target.value;
          render();
        });
      });

      document.querySelectorAll("[data-toggle]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          const task = tasks.find(item => item.id === button.dataset.toggle);
          if (task) task.expanded = task.expanded === false;
          render();
        });
      });

      document.querySelectorAll("[data-child]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          addTask({ parent: button.dataset.child });
        });
      });

      document.querySelectorAll("[data-reorder]").forEach(row => {
        row.addEventListener("dragstart", event => {
          draggingTaskId = row.dataset.reorder;
          row.classList.add("dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", draggingTaskId);
        });

        row.addEventListener("dragend", () => {
          draggingTaskId = "";
          document.querySelectorAll(".task-row.dragging, .task-row.drop-before, .task-row.drop-after").forEach(item => {
            item.classList.remove("dragging", "drop-before", "drop-after");
          });
        });

        row.addEventListener("dragover", event => {
          const sourceId = draggingTaskId || event.dataTransfer.getData("text/plain");
          const source = tasks.find(task => task.id === sourceId);
          const target = tasks.find(task => task.id === row.dataset.reorder);
          if (!source || !target || source.id === target.id || source.parent !== target.parent) return;
          event.preventDefault();
          const rect = row.getBoundingClientRect();
          const place = event.clientY > rect.top + rect.height / 2 ? "after" : "before";
          row.classList.toggle("drop-before", place === "before");
          row.classList.toggle("drop-after", place === "after");
        });

        row.addEventListener("dragleave", () => {
          row.classList.remove("drop-before", "drop-after");
        });

        row.addEventListener("drop", event => {
          event.preventDefault();
          const sourceId = draggingTaskId || event.dataTransfer.getData("text/plain");
          const rect = row.getBoundingClientRect();
          const place = event.clientY > rect.top + rect.height / 2 ? "after" : "before";
          if (moveTaskBeforeOrAfter(sourceId, row.dataset.reorder, place)) render();
        });
      });

      document.querySelectorAll("[data-drag]").forEach(bar => {
        bar.addEventListener("mousedown", event => startDrag(event, bar.dataset.drag, rangeStart, unitDays));
      });

      document.querySelectorAll("[data-resize]").forEach(handle => {
        handle.addEventListener("mousedown", event => startResize(event, handle.dataset.id, handle.dataset.resize, unitDays));
      });

      document.querySelectorAll("[data-link-from]").forEach(handle => {
        handle.addEventListener("mousedown", event => startDependencyLink(event, handle.dataset.linkFrom));
      });

      document.getElementById("ganttFullscreenToggle")?.addEventListener("click", event => {
        event.stopPropagation();
        ganttFullscreen = !ganttFullscreen;
        activeView = "gantt";
        render();
      });

      document.getElementById("addTaskBtn")?.addEventListener("click", () => addTask());
      document.getElementById("addMilestoneBtn")?.addEventListener("click", () => addTask({ type: "milestone" }));

      document.querySelectorAll("[data-remove-dependency-from]").forEach(path => {
        path.addEventListener("click", event => {
          event.stopPropagation();
          const fromId = path.dataset.removeDependencyFrom;
          const toId = path.dataset.removeDependencyTo;
          const from = tasks.find(task => task.id === fromId);
          const to = tasks.find(task => task.id === toId);
          if (!from || !to) return;
          if (confirm(`「${to.name}」から「${from.name}」への依存関係を削除しますか？`)) {
            removeDependency(fromId, toId);
            render();
          }
        });
      });
    }

    function bindGanttScrollSync() {
      const taskTable = document.querySelector(".task-table");
      const timeline = document.querySelector(".timeline");
      const taskRows = document.getElementById("taskRows");
      if (!taskTable || !timeline) return;
      taskTable.classList.add("is-y-synced");

      let syncing = false;
      const syncY = source => {
        if (syncing) return;
        syncing = true;
        const y = source.scrollTop;
        if (taskRows) taskRows.style.transform = `translateY(${-y}px)`;
        taskTable.scrollTop = 0;
        requestAnimationFrame(() => {
          syncing = false;
        });
      };

      timeline.addEventListener("scroll", () => syncY(timeline), { passive: true });
      taskTable.addEventListener("wheel", event => {
        if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;
        event.preventDefault();
        timeline.scrollTop += event.deltaY;
      }, { passive: false });
      syncY(timeline);
    }

    function startDrag(event, id, rangeStart, unitDays) {
      if (event.target.dataset.resize) return;
      event.preventDefault();
      event.stopPropagation();
      selectedTaskId = id;
      const task = tasks.find(item => item.id === id);
      const moving = [task, ...descendantsOf(id)];
      const startX = event.clientX;
      const startY = event.clientY;
      let dragMode = "";
      let reorderTargetId = "";
      let reorderPlace = "after";
      const originals = moving.map(item => ({ id: item.id, start: parseDate(item.start), end: parseDate(item.end) }));
      const dayW = els.scaleSelect.value === "week" ? 58 : 36;

      document.onmousemove = moveEvent => {
        const moveX = moveEvent.clientX - startX;
        const moveY = moveEvent.clientY - startY;
        if (!dragMode && (Math.abs(moveX) > 6 || Math.abs(moveY) > 10)) {
          dragMode = Math.abs(moveY) > Math.abs(moveX) ? "reorder" : "schedule";
        }

        if (dragMode === "reorder") {
          document.querySelectorAll(".timeline-row.drop-before, .timeline-row.drop-after, .task-row.drop-before, .task-row.drop-after").forEach(row => {
            row.classList.remove("drop-before", "drop-after");
          });

          const row = document.elementFromPoint(moveEvent.clientX, moveEvent.clientY)?.closest("[data-timeline-row]");
          const target = row ? tasks.find(item => item.id === row.dataset.timelineRow) : null;
          if (!target || target.id === id || target.parent !== task.parent) {
            reorderTargetId = "";
            return;
          }

          const rect = row.getBoundingClientRect();
          reorderPlace = moveEvent.clientY > rect.top + rect.height / 2 ? "after" : "before";
          reorderTargetId = target.id;
          row.classList.add(reorderPlace === "after" ? "drop-after" : "drop-before");
          const sideRow = document.querySelector(`[data-reorder="${CSS.escape(target.id)}"]`);
          sideRow?.classList.add(reorderPlace === "after" ? "drop-after" : "drop-before");
          return;
        }

        const diffDays = Math.round(moveX / dayW) * unitDays;
        moving.forEach(item => {
          const original = originals.find(base => base.id === item.id);
          item.start = formatDate(addDays(original.start, diffDays));
          item.end = item.type === "milestone" ? item.start : formatDate(addDays(original.end, diffDays));
        });
        if (task.parent) syncParentDates(task.parent);
        renderGantt();
      };

      document.onmouseup = () => {
        document.onmousemove = null;
        document.onmouseup = null;
        document.querySelectorAll(".timeline-row.drop-before, .timeline-row.drop-after, .task-row.drop-before, .task-row.drop-after").forEach(row => {
          row.classList.remove("drop-before", "drop-after");
        });
        if (dragMode === "reorder" && reorderTargetId) {
          moveTaskBeforeOrAfter(id, reorderTargetId, reorderPlace);
        }
        saveTasks();
        render();
      };
    }

    function startResize(event, id, direction, unitDays) {
      event.preventDefault();
      event.stopPropagation();
      const task = tasks.find(item => item.id === id);
      if (!task) return;
      const startX = event.clientX;
      const originalStart = parseDate(task.start);
      const originalEnd = parseDate(task.end);
      const dayW = els.scaleSelect.value === "week" ? 58 : 36;

      document.onmousemove = moveEvent => {
        const diffDays = Math.round((moveEvent.clientX - startX) / dayW) * unitDays;
        if (direction === "left") {
          const next = addDays(originalStart, diffDays);
          if (next <= parseDate(task.end)) task.start = formatDate(next);
        } else {
          const next = addDays(originalEnd, diffDays);
          if (next >= parseDate(task.start)) task.end = formatDate(next);
        }
        syncParentDates(task.parent);
        renderGantt();
      };

      document.onmouseup = () => {
        document.onmousemove = null;
        document.onmouseup = null;
        saveTasks();
        render();
      };
    }

    function startDependencyLink(event, fromId) {
      event.preventDefault();
      event.stopPropagation();
      const fromTask = tasks.find(task => task.id === fromId);
      if (!fromTask) return;
      document.body.classList.add("linking-dependency");

      const timelineBody = document.getElementById("timelineBody");
      const bodyRect = timelineBody.getBoundingClientRect();
      const startX = event.clientX - bodyRect.left + timelineBody.scrollLeft;
      const startY = event.clientY - bodyRect.top + timelineBody.scrollTop;
      const preview = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      preview.classList.add("dependency-layer");
      preview.style.pointerEvents = "none";
      preview.setAttribute("width", timelineBody.scrollWidth);
      preview.setAttribute("height", timelineBody.scrollHeight);
      preview.innerHTML = `<path class="dependency-preview" d="M ${startX} ${startY} L ${startX} ${startY}"></path>`;
      timelineBody.prepend(preview);
      const path = preview.querySelector("path");
      let targetId = "";

      document.onmousemove = moveEvent => {
        const x = moveEvent.clientX - bodyRect.left + timelineBody.scrollLeft;
        const y = moveEvent.clientY - bodyRect.top + timelineBody.scrollTop;
        const midX = Math.max(startX + 20, (startX + x) / 2);
        path.setAttribute("d", `M ${startX} ${startY} H ${midX} V ${y} H ${x}`);

        document.querySelectorAll(".timeline-row.dependency-target").forEach(row => row.classList.remove("dependency-target"));
        const row = document.elementFromPoint(moveEvent.clientX, moveEvent.clientY)?.closest("[data-timeline-row]");
        const target = row ? tasks.find(task => task.id === row.dataset.timelineRow) : null;
        targetId = target && target.id !== fromId && target.type !== "group" ? target.id : "";
        if (targetId) row.classList.add("dependency-target");
      };

      document.onmouseup = () => {
        document.onmousemove = null;
        document.onmouseup = null;
        document.body.classList.remove("linking-dependency");
        preview.remove();
        document.querySelectorAll(".timeline-row.dependency-target").forEach(row => row.classList.remove("dependency-target"));
        if (targetId) {
          const target = tasks.find(task => task.id === targetId);
          target.dependencies = Array.isArray(target.dependencies) ? target.dependencies : [];
          if (!target.dependencies.includes(fromId)) target.dependencies.push(fromId);
          normalizeTask(target);
          saveTasks();
        }
        render();
      };
    }

    function earliestStart() {
      return tasks.map(task => task.start).sort()[0] || formatDate(today);
    }

    function addTask(overrides = {}) {
      const baseDate = formatDate(today);
      const id = `task-${Date.now()}`;
      const parent = overrides.parent || "";
      const parentTask = tasks.find(task => task.id === parent);
      if (parentTask) {
        parentTask.type = "group";
        parentTask.expanded = true;
      }
      tasks.push({
        id,
        name: overrides.type === "milestone" ? "新しいマイルストーン" : "新しいタスク",
        owner: "",
        status: "todo",
        priority: "medium",
        start: baseDate,
        end: overrides.type === "milestone" ? baseDate : formatDate(addDays(today, 4)),
        progress: 0,
        dependencies: [],
        parent,
        type: overrides.type || "task",
        expanded: true,
        notes: ""
      });
      syncParentDates(parent);
      selectedTaskId = id;
      render();
      openDrawer(id);
    }

    function openDrawer(id) {
      const task = tasks.find(item => item.id === id);
      if (!task) return;
      editingTaskId = id;
      selectedTaskId = id;
      document.getElementById("drawerTitle").textContent = "タスク編集";
      document.getElementById("formName").value = task.name;
      document.getElementById("formType").value = task.type;
      document.getElementById("formStatus").value = task.status;
      document.getElementById("formPriority").value = task.priority;
      document.getElementById("formOwner").value = task.owner || "";
      document.getElementById("formProgress").value = task.progress;
      document.getElementById("formStart").value = task.start;
      document.getElementById("formEnd").value = task.end;
      document.getElementById("formNotes").value = task.notes || "";
      document.getElementById("formParent").innerHTML = `<option value="">なし</option>` + tasks
        .filter(item => item.id !== id && !descendantsOf(id).some(child => child.id === item.id))
        .map(item => `<option value="${item.id}" ${task.parent === item.id ? "selected" : ""}>${escapeHtml(item.name)}</option>`)
        .join("");
      document.getElementById("formDependencies").innerHTML = tasks
        .filter(item => item.id !== id && item.type !== "group" && !descendantsOf(id).some(child => child.id === item.id))
        .map(item => `<option value="${item.id}" ${(task.dependencies || []).includes(item.id) ? "selected" : ""}>${escapeHtml(item.name)}</option>`)
        .join("");
      els.drawer.classList.add("open");
    }

    function closeDrawer() {
      els.drawer.classList.remove("open");
      editingTaskId = "";
    }

    function deleteTask(id) {
      const ids = new Set([id, ...descendantsOf(id).map(task => task.id)]);
      const parent = tasks.find(task => task.id === id)?.parent || "";
      tasks = tasks.filter(task => !ids.has(task.id));
      tasks.forEach(task => {
        task.dependencies = (task.dependencies || []).filter(depId => !ids.has(depId));
      });
      syncParentDates(parent);
      selectedTaskId = "";
      closeDrawer();
      render();
    }

    function exportCsv() {
      const header = ["タスク名", "種別", "担当者", "状態", "優先度", "開始日", "終了日", "進捗", "親タスク", "依存先", "メモ"];
      const rows = tasks.map(task => [
        task.name,
        task.type,
        task.owner,
        statusMeta[task.status].label,
        priorityMeta[task.priority],
        task.start,
        task.end,
        `${task.progress}%`,
        tasks.find(item => item.id === task.parent)?.name || "",
        dependencyNames(task),
        task.notes || ""
      ]);
      const csv = [header, ...rows].map(row => row.map(value => `"${String(value).replaceAll('"', '""')}"`).join(",")).join("\n");
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `project-tasks-${formatDate(today)}.csv`;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        activeView = tab.dataset.view;
        render();
      });
    });

    [els.scaleSelect].forEach(input => {
      input.addEventListener("input", render);
      input.addEventListener("change", render);
    });

    document.getElementById("exportBtn").addEventListener("click", exportCsv);
    document.getElementById("resetBtn").addEventListener("click", () => {
      if (confirm("初期データに戻しますか？現在のローカルデータは上書きされます。")) {
        tasks = structuredClone(seedTasks);
        selectedTaskId = "";
        viewStartDate = earliestStart();
        render();
      }
    });

    document.getElementById("closeDrawerBtn").addEventListener("click", closeDrawer);
    document.getElementById("cancelBtn").addEventListener("click", closeDrawer);
    els.drawer.addEventListener("click", event => {
      if (event.target === els.drawer) closeDrawer();
    });

    els.viewRoot.addEventListener("click", event => {
      const opener = event.target.closest("[data-open]");
      if (opener) openDrawer(opener.dataset.open);
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && ganttFullscreen) {
        ganttFullscreen = false;
        render();
        return;
      }
      if (event.key !== "Delete" || !selectedTaskId) return;
      const target = event.target;
      const isEditing = target && ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName);
      if (isEditing || els.drawer.classList.contains("open")) return;
      const task = tasks.find(item => item.id === selectedTaskId);
      if (task && confirm(`「${task.name}」を削除しますか？子タスクも削除されます。`)) {
        deleteTask(selectedTaskId);
      }
    });

    els.taskForm.addEventListener("submit", event => {
      event.preventDefault();
      const task = tasks.find(item => item.id === editingTaskId);
      if (!task) return;
      const oldParent = task.parent;
      task.name = document.getElementById("formName").value.trim() || "無題のタスク";
      task.type = document.getElementById("formType").value;
      task.parent = document.getElementById("formParent").value;
      task.status = document.getElementById("formStatus").value;
      task.priority = document.getElementById("formPriority").value;
      task.owner = document.getElementById("formOwner").value.trim();
      task.progress = clamp(document.getElementById("formProgress").value, 0, 100);
      if (task.status === "done") task.progress = 100;
      else if (task.status === "todo") task.progress = 0;
      else if (task.status === "doing" && (task.progress === 0 || task.progress === 100)) task.progress = 50;
      task.start = document.getElementById("formStart").value;
      task.end = document.getElementById("formEnd").value;
      task.dependencies = Array.from(document.getElementById("formDependencies").selectedOptions).map(option => option.value);
      task.notes = document.getElementById("formNotes").value.trim();
      normalizeTask(task);
      syncParentDates(oldParent);
      syncParentDates(task.parent);
      closeDrawer();
      render();
    });

    document.getElementById("deleteTaskBtn").addEventListener("click", () => {
      if (editingTaskId && confirm("このタスクと子タスクを削除しますか？")) deleteTask(editingTaskId);
    });

    viewStartDate = earliestStart();
    render();
  </script>
</body>
</html>
